name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (core)
        run: cargo clippy -p iv-engine --all-targets --all-features -- -D warnings

      - name: Test (core)
        run: cargo test -p iv-engine --all-features

      - name: Examples
        run: |
          cargo run -p iv-engine --example atm_roundtrip
          cargo run -p iv-engine --example strike_grid --features rayon

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        working-directory: python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip maturin pytest numpy pandas
          maturin develop
          pytest -m "not profile"

      - name: Clippy (bindings)
        run: cargo clippy -p iv-engine-py -- -D warnings
