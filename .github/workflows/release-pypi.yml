# Build Linux / macOS / Windows wheels and publish to PyPI on version tags.
#
# Prerequisites:
#   1. PyPI API token in repo secret PYPI_API_TOKEN
#   2. Tag must match pyproject version after strip, e.g. tag v0.1.0 → version 0.1.0
#
# Release:
#   git tag v0.1.0 && git push origin v0.1.0

name: Release PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  MATURIN_VERSION: "1.15.0"

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/set_version_from_tag.py "$VERSION"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "v${{ env.MATURIN_VERSION }}"
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: --release --out dist --compatibility pypi -i python3.12
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    name: Windows ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Set package version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/set_version_from_tag.py "$VERSION"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "v${{ env.MATURIN_VERSION }}"
          target: ${{ matrix.target }}
          args: --release --out dist --compatibility pypi -i python3.12
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/set_version_from_tag.py "$VERSION"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "v${{ env.MATURIN_VERSION }}"
          target: ${{ matrix.target }}
          args: --release --out dist --compatibility pypi -i python3.12
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/set_version_from_tag.py "$VERSION"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "v${{ env.MATURIN_VERSION }}"
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Upload to PyPI
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List dist
        run: ls -la dist/

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: "v${{ env.MATURIN_VERSION }}"
          command: upload
          args: --non-interactive --skip-existing dist/*
