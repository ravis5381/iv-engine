# Local develop / pytest config when working inside `python/`.
# For pip installs from a clone, prefer the workspace-root pyproject.toml:
#
#   pip install .
#   pip install -e '.[dev]'
#
# This file remains so `cd python && maturin develop` keeps working.

[project]
name = "iv-engine"
version = "0.1.1"
description = "Implied volatility and Black/Black-Scholes via Let's Be Rational"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["../LICENSE", "../NOTICE"]
authors = [{ name = "iv-engine contributors" }]
keywords = ["quant", "finance", "options", "volatility", "black-scholes"]
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pandas>=1.5"]
pandas = ["pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/ravis5381/iv-engine"
Documentation = "https://github.com/ravis5381/iv-engine/tree/master/python#readme"
Repository = "https://github.com/ravis5381/iv-engine"
Examples = "https://github.com/ravis5381/iv-engine/blob/master/python/examples/python_examples.ipynb"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "iv_engine._core"
python-source = "."
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "profile: large (1M-row) timing benchmarks; run with: pytest -m profile -s",
]
addopts = "-m 'not profile'"
