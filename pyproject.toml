# Packaging root for the Python wheel (maturin).
#
# Install from a clone with a Rust toolchain available:
#
#   pip install .
#   pip install '.[pandas]'
#   pip install -e '.[dev]'
#
# The numerical core lives in `rust/`; bindings in `python/`. Putting this file
# at the Cargo workspace root lets the sdist include both crates.

[project]
name = "iv-engine"
version = "0.1.0"
description = "Implied volatility and Black/Black-Scholes via Let's Be Rational"
readme = "python/README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "iv-engine contributors" }]
keywords = ["quant", "finance", "options", "volatility", "black-scholes"]
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pandas>=1.5"]
pandas = ["pandas>=1.5"]

[project.urls]
Repository = "ssh://git@git_server/ravi.singh/bsm-iv-engine.git"

[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "python/Cargo.toml"
module-name = "iv_engine._core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = [
    "profile: large (1M-row) timing benchmarks; run with: pytest -m profile -s",
]
addopts = "-m 'not profile'"
